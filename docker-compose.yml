services:
  postgres:
    image: postgres:16-alpine
    container_name: txscope-postgres
    environment:
      POSTGRES_DB: txscope
      POSTGRES_USER: txscope
      POSTGRES_PASSWORD: txscope
    ports:
      - "5432:5432"
    volumes:
      - txscope-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txscope -d txscope"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  txscope-pgdata:
